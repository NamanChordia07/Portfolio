# Hand-labelled challenge set.
#
# Unlike the template benchmark, every case here was written by hand against the fact sheets of
# the three synthetic datasets, and the expected verdict is what a careful analyst would conclude
# from the data, NOT what Proofline currently outputs. Some cases encode behaviour Proofline did
# not have when the set was written (see docs/BENCHMARK.md, "Challenge set"). Results are reported
# as they come out, failures included.
#
# expect: every claim the verifier should find, in order of appearance.
#   token  - the exact text of the number or direction word
#   status - supported | contradicted | unverifiable
#   reason - optional; checked only when given (contradicted and ambiguous cases)
# A case with `expect: []` must produce no claims at all.

