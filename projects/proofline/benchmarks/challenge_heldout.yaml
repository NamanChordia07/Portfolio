# Held-out challenge set.
#
# Written after benchmarks/challenge.yaml had been used to fix Proofline, so that set is no longer
# an unbiased test. These cases were written by hand from the fact sheets alone (values looked up in
# the computed facts, never in verifier output), in phrasings that do not appear in the first set,
# and run exactly once before any change to Proofline. The first-run result is kept in
# docs/results/challenge_heldout_first_run.json whatever it shows.
#
# Same format as challenge.yaml:
#   token  - the exact text of the number or direction word
#   status - supported | contradicted | unverifiable
#   reason - optional; checked only when given

- {id: hb-01, category: basics, dataset: hotel_weekly, text: "Portfolio RevPAR was $108.77, down 3.6% on the prior week.",
   expect: [{token: "$108.77", status: supported}, {token: "3.6%", status: supported}]}
- {id: hb-02, category: basics, dataset: hotel_weekly, text: "Rooms sold reached 2,853, 222 more than a year ago.",
