projects:
  - id: proofline
    name: Proofline
    link: { label: github.com/NamanChordia07/proofline, url: "https://github.com/NamanChordia07/proofline" }
    tech: Python, MCP, pytest, Hypothesis
    dates: Sep 2026
    rank: { fde: 1, ai: 1, sde: 2 }
    bullets:
      - id: pl_what
        fde: >-
          Built a verifier that checks every number in LLM-written reports against source data, diagnoses the error
          (wrong basis, entity, direction, points vs. percent) and repairs it; CI-gating CLI, Python library and MCP server.
        ai: >-
          Built a verifier that catches numeric hallucinations in LLM-written reports: computes facts from data, ties each
          claim to a metric, entity and comparison basis, diagnoses 8 error types and repairs them with minimal edits.
        sde: >-
          Built a zero-dependency Python library and CLI that parses numbers with display-precision semantics, attributes
          each claim to a metric, entity and comparison basis, and verifies it against computed facts.
      - id: pl_eval
        text: >-
          Built the benchmark with independent ground truth (3 domains, 9 injected error types, held-out phrasing):
          98.9–100% recall at 1.1–4.5% false alarms on unseen phrasing, vs. 16–20% recall for a naive value lookup.
        ai: >-
          Designed the evaluation with independent ground truth (3 domains, 9 injected error types, held-out phrasing):
          98.9–100% recall at 1.1–4.5% false alarms on unseen phrasing vs. 16–20% for a naive value lookup; ablations
          show a fixed ±1% tolerance yields 24–29% false alarms.
      - id: pl_ship
        in: [ai]
        text: >-
          Shipped as a Python library, CI-gating CLI and an MCP server agents can call, with a guarded Gemini/Claude loop
          (draft, verify, targeted feedback, deterministic repair); 58 tests, 93% coverage, mypy --strict.
