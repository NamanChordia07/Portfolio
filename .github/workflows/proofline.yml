name: proofline

on:
  push:
    paths: ["projects/proofline/**", ".github/workflows/proofline.yml"]
  pull_request:
    paths: ["projects/proofline/**", ".github/workflows/proofline.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/proofline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy
      - run: pytest
      - run: proofline demo
      - run: proofline challenge --set original && proofline challenge --set heldout
