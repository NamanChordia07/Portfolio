# CI for the standalone Proofline repository. In the Portfolio monorepo, .github/workflows/proofline.yml runs the same checks.
name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy
      - run: pytest
      - run: proofline demo
      - run: proofline challenge --set original && proofline challenge --set heldout
      - run: proofline bench --n 50 --families dev,heldout
